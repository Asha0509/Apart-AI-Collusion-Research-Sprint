[project]
name = "cartel-inheritance"
version = "0.1.0"
description = "Swap the Model, Keep the Cartel — Apart AI Collusion Sprint 2026 (analysis + sprint code)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "scienceplots>=2.1",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: hits the network / costs money"]

[tool.ruff]
line-length = 110
extend-exclude = ["starter"]   # pre-existing code: never reformat

[tool.ruff.lint]
select = ["E", "F", "B", "I", "NPY", "PD"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"
